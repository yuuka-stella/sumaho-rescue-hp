<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 540" role="img" aria-labelledby="naosukeTitle">
  <title id="naosukeTitle">なおすけ:赤いヘルメットと作業服で親指を立てて笑うキャラクター</title>
  <defs>
    <linearGradient id="jacketGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EE4C3E"/>
      <stop offset="100%" stop-color="#DA2E22"/>
    </linearGradient>
  </defs>

  <!-- motion lines -->
  <g stroke="#DA2E22" stroke-width="10" stroke-linecap="round" opacity="0.85">
    <line x1="46" y1="330" x2="90" y2="318" transform="rotate(-8 68 324)"/>
    <line x1="40" y1="360" x2="86" y2="360"/>
    <line x1="46" y1="392" x2="90" y2="404" transform="rotate(8 68 398)"/>
  </g>

  <!-- raised arm + fist (thumbs up), drawn behind jacket edge -->
  <g>
    <path d="M150 520 C120 480 108 440 118 400 C124 376 140 356 162 344 C176 336 194 336 206 348 C218 360 218 378 206 392 L188 414 C210 400 226 378 226 356 C226 332 210 314 188 314 C170 314 156 328 152 346 L150 356" fill="#FBCB9B"/>
    <!-- fist -->
    <circle cx="196" cy="330" r="40" fill="#FBCB9B"/>
    <!-- thumb -->
    <path d="M186 300 C182 276 188 254 202 244 C214 236 228 240 232 254 C236 268 228 282 214 290 C222 292 228 300 226 310 C224 320 212 326 200 322" fill="#FBCB9B" stroke="#FBCB9B" stroke-width="2"/>
    <!-- knuckle lines -->
    <g stroke="#E8A96C" stroke-width="3" stroke-linecap="round" opacity="0.7">
      <line x1="176" y1="316" x2="176" y2="336"/>
      <line x1="192" y1="322" x2="192" y2="344"/>
      <line x1="208" y1="320" x2="208" y2="342"/>
    </g>
  </g>

  <!-- body / jacket -->
  <path d="M96 540 C86 460 104 400 150 372 C184 352 220 344 240 344 C260 344 296 352 330 372 C376 400 394 460 384 540 Z" fill="url(#jacketGrad)"/>

  <!-- undershirt -->
  <path d="M206 372 C218 392 262 392 274 372 L268 410 C260 420 220 420 212 410 Z" fill="#F4F1EA"/>

  <!-- collar -->
  <path d="M186 366 L226 350 L240 388 Z" fill="#C21F1F"/>
  <path d="M294 366 L254 350 L240 388 Z" fill="#C21F1F"/>

  <!-- name badges -->
  <rect x="150" y="470" width="70" height="26" rx="8" fill="#FBF8F1"/>
  <rect x="260" y="470" width="70" height="26" rx="8" fill="#FBF8F1"/>

  <!-- neck -->
  <rect x="212" y="266" width="56" height="60" rx="20" fill="#FBCB9B"/>

  <!-- ears -->
  <circle cx="162" cy="230" r="18" fill="#FBCB9B"/>
  <circle cx="318" cy="230" r="18" fill="#FBCB9B"/>

  <!-- head -->
  <ellipse cx="240" cy="216" rx="98" ry="102" fill="#FDD7A8"/>

  <!-- eyebrows -->
  <path d="M186 196 C198 186 214 186 224 194" fill="none" stroke="#3A2A20" stroke-width="8" stroke-linecap="round"/>
  <path d="M256 194 C266 186 282 186 294 196" fill="none" stroke="#3A2A20" stroke-width="8" stroke-linecap="round"/>

  <!-- eyes -->
  <circle cx="206" cy="222" r="10" fill="#2B2016"/>
  <circle cx="274" cy="222" r="10" fill="#2B2016"/>

  <!-- blush -->
  <ellipse cx="192" cy="252" rx="16" ry="10" fill="#F79E8C" opacity="0.55"/>
  <ellipse cx="288" cy="252" rx="16" ry="10" fill="#F79E8C" opacity="0.55"/>

  <!-- nose -->
  <path d="M236 232 C232 240 230 246 236 250" fill="none" stroke="#E8A96C" stroke-width="6" stroke-linecap="round"/>

  <!-- mouth: big open smile -->
  <path d="M196 258 C214 292 266 292 284 258 C266 274 214 274 196 258 Z" fill="#8C2A1F"/>
  <path d="M206 262 C220 280 260 280 274 262" fill="none" stroke="#FBCB9B" stroke-width="8" stroke-linecap="round"/>

  <!-- helmet -->
  <path d="M124 190 C124 116 176 66 240 66 C304 66 356 116 356 190 L356 206 C356 214 350 220 342 220 L138 220 C130 220 124 214 124 206 Z" fill="#E2342B"/>
  <path d="M118 202 C118 186 170 176 240 176 C310 176 362 186 362 202 C362 216 350 224 336 224 L144 224 C130 224 118 216 118 202 Z" fill="#C21F1F"/>
  <path d="M150 176 C150 118 190 82 240 82" fill="none" stroke="#F16B5C" stroke-width="10" stroke-linecap="round" opacity="0.6"/>

  <!-- cross emblem -->
  <g fill="#FBF8F1">
    <rect x="224" y="100" width="32" height="76" rx="8"/>
    <rect x="202" y="122" width="76" height="32" rx="8"/>
  </g>
</svg>
